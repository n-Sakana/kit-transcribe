name: Bundle Whisper weights once
on:
  push:
    branches: [codex/whisper-small-turbo-refinement]
    paths: [.github/workflows/bundle-once.yml]
permissions:
  contents: read
jobs:
  bundle:
    if: github.repository == 'n-Sakana/pub-transcribe' && github.ref == 'refs/heads/codex/whisper-small-turbo-refinement'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Acquire and verify the fixed weights on the packaging machine only
        shell: powershell
        run: .\src\app\setup-models.ps1
      - name: Commit real binary parts with small, non-delta Git pushes
        shell: python
        run: |
          import hashlib, pathlib, subprocess, time
          root = pathlib.Path('src/app/model')
          branch = 'refs/heads/codex/whisper-small-turbo-refinement'
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          def publish():
              for attempt in range(3):
                  result = subprocess.run(['git', '-c', 'pack.window=0', '-c', 'pack.compression=1', 'push', 'origin', 'HEAD:' + branch])
                  if result.returncode == 0:
                      return
                  local = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
                  remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch]).decode().split()
                  if remote and remote[0] == local:
                      return
                  if attempt == 2:
                      raise RuntimeError('Bundle push failed; no force push is allowed')
                  time.sleep(5)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('config', 'pack.window', '0')
          git('config', 'pack.compression', '1')
          git('config', 'pack.threads', '2')
          paths = []
          specs = [
              ('whisper-small', 'small', '4cbe7b22fa9026b843b60a68640c747de05bafb1a11b57edc0e66c232d9f33a9', 'acad50b5c782696e91b55914cc5ab4f756f1532f76e22aa6fc615f39fb69a8ee'),
              ('whisper-large-v3-turbo', 'turbo', 'b02dcdf54f348741e93fe732b67d933c8dcb6735655f710640143081db38878b', '20accd02388482eb3a46bd615631adfdc85e1eb2c7db9ea3f02a40ffe6b81547')
          ]
          for directory, name, encoder_hash, decoder_hash in specs:
              for role, expected in [('encoder', encoder_hash), ('decoder', decoder_hash)]:
                  source = root / directory / (name + '-' + role + '.int8.onnx')
                  digest = hashlib.sha256()
                  lines = []
                  with source.open('rb') as stream:
                      index = 1
                      while data := stream.read(75 * 1024 * 1024):
                          digest.update(data)
                          part = source.with_name(source.name + '.part%02d' % index)
                          part.write_bytes(data)
                          lines.append('%s %d %s' % (hashlib.sha256(data).hexdigest(), len(data), part.name))
                          paths.append(part.as_posix())
                          index += 1
                  if digest.hexdigest() != expected:
                      raise RuntimeError('Unexpected weight checksum: ' + str(source))
                  manifest = source.with_name(source.name + '.manifest')
                  manifest.write_bytes(('%s %d %s\n' % (expected, source.stat().st_size, source.name) + '\n'.join(lines) + '\n').encode('ascii'))
                  paths.append(manifest.as_posix())
              token = root / directory / (name + '-tokens.txt')
              if hashlib.sha256(token.read_bytes()).hexdigest() != 'b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126':
                  raise RuntimeError('Unexpected token table checksum')
              paths.append(token.as_posix())
          for offset in range(0, len(paths), 2):
              group = paths[offset:offset+2]
              git('add', '-f', '--', *group)
              changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode
              if changed == 0:
                  continue
              if changed != 1:
                  raise RuntimeError('Cannot inspect the staged bundle')
              git('commit', '-m', 'Bundle verified Whisper model files (%d/%d)' % (offset // 2 + 1, (len(paths) + 1) // 2))
              print('PUBLISHING_BATCH', offset // 2 + 1, flush=True)
              publish()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          sums = []
          for path in sorted(p for p in tracked if p and p != 'SHA256SUMS.txt'):
              process = subprocess.Popen(['git', 'cat-file', 'blob', ':' + path], stdout=subprocess.PIPE)
              digest = hashlib.sha256()
              with process.stdout:
                  for data in iter(lambda: process.stdout.read(1024 * 1024), b''):
                      digest.update(data)
              if process.wait() != 0:
                  raise RuntimeError('Could not hash staged path: ' + path)
              sums.append(digest.hexdigest() + '  ' + path)
          pathlib.Path('SHA256SUMS.txt').write_bytes(('\n'.join(sums) + '\n').encode('utf-8'))
          git('add', 'SHA256SUMS.txt')
          git('commit', '-m', 'Record checksums for all bundled model files')
          publish()
          print('BUNDLE_COMMIT', subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip())
