name: Finalize offline bundle
on:
  push:
    branches: [codex/whisper-small-turbo-refinement]
    paths: [.github/workflows/finalize-offline-once.yml]
permissions:
  contents: read
jobs:
  finalize:
    if: github.repository == 'n-Sakana/pub-transcribe' && github.ref == 'refs/heads/codex/whisper-small-turbo-refinement'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Connect the bundled model loader and remove old download guidance
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          app = pathlib.Path('src/app')
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Unexpected source while applying offline integration: ' + old)
              return text.replace(old, new, 1)
          path = app / 'engine.cs'
          source = path.read_text(encoding='utf-8-sig')
          source = replace_once(source, 'VerifyFile(config.ModelConfig.Whisper.Encoder, encoderHash);', 'BundledModel.Ensure(config.ModelConfig.Whisper.Encoder, encoderHash);')
          source = replace_once(source, 'VerifyFile(config.ModelConfig.Whisper.Decoder, decoderHash);', 'BundledModel.Ensure(config.ModelConfig.Whisper.Decoder, decoderHash);')
          small_hash = hashlib.sha256((app / 'model/whisper-small/small-tokens.txt').read_bytes()).hexdigest()
          turbo_hash = hashlib.sha256((app / 'model/whisper-large-v3-turbo/turbo-tokens.txt').read_bytes()).hexdigest()
          source = replace_once(source, 'VerifyTokens(config.ModelConfig.Tokens);', 'VerifyFile(config.ModelConfig.Tokens, refinement\n            ? "' + turbo_hash + '"\n            : "' + small_hash + '");\n        VerifyTokens(config.ModelConfig.Tokens);')
          source = source.replace('Model file missing. Run setup-models.cmd before recording/refining: ', 'Bundled model file missing. Restore the complete application folder: ')
          source = source.replace('Model checksum mismatch. Run setup-models.cmd to repair: ', 'Bundled model checksum mismatch. Restore the complete application folder: ')
          source = source.replace('Token file missing. Run setup-models.cmd: ', 'Bundled token file missing. Restore the complete application folder: ')
          path.write_bytes(source.encode('utf-8'))
          path = app / 'bootstrap.ps1'
          source = path.read_text(encoding='utf-8-sig')
          old = "$source = [IO.File]::ReadAllText((Join-Path $PSScriptRoot 'engine.cs'))"
          new = old + "\n    $bundle = [IO.File]::ReadAllText((Join-Path $PSScriptRoot 'bundled-model.cs')) -replace '(?m)^using [^;]+;\\r?\\n', ''\n    $source = 'using System.Globalization;' + \"`r`n\" + $source + \"`r`n\" + $bundle"
          source = replace_once(source, old, new)
          path.write_bytes(source.encode('utf-8-sig'))
          path = app / 'main.ps1'
          source = path.read_text(encoding='utf-8-sig')
          source = replace_once(source, '準備完了。モデル未取得の場合は setup-models.cmd を実行してください。', '準備完了。モデルは同梱済みです。初回は録音開始時にローカルで準備します。')
          source = source.replace('Whisper small を検証・読み込み中', 'Whisper small の同梱モデルを準備・検証・読み込み中')
          source = source.replace('Whisper large-v3-turbo を検証・読み込み中', 'Whisper large-v3-turbo の同梱モデルを準備・検証・読み込み中')
          path.write_bytes(source.encode('utf-8-sig'))
          for name in ['engine.cs', 'bootstrap.ps1', 'main.ps1']:
              subprocess.run(['git', 'add', '--', (app / name).as_posix()], check=True)
          print('OFFLINE_INTEGRATION_OK')
          print('TOKEN_SHA256 small', small_hash)
          print('TOKEN_SHA256 turbo', turbo_hash)
      - name: Refresh checksums and make the complete local commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python .\test\update-checksums.py
          if ($LASTEXITCODE -ne 0) { throw 'Checksum generation failed' }
          git add SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Load Whisper models exclusively from the bundled local parts'
          if ($LASTEXITCODE -ne 0) { throw 'Offline integration commit failed' }
      - name: Syntax, WPF, engine, bundle and token regression tests
        shell: powershell
        run: |
          .\test\check.ps1 -Runtime
          .\test\engine.ps1
          .\test\bundle.ps1
          .\test\token-validation.ps1
          .\test\native-vad.ps1
          .\test\checksums.ps1
      - name: First-use reconstruction and real inference with outbound traffic blocked
        shell: powershell
        run: .\test\run-offline-ci.ps1
      - name: Publish tested code to the existing PR branch only
        shell: powershell
        run: |
          git push origin HEAD:refs/heads/codex/whisper-small-turbo-refinement
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; no force push is allowed' }
          Write-Output ('OFFLINE_BUNDLE_COMMIT ' + (git rev-parse HEAD))
